apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-config-apply
  annotations:
    argocd.argoproj.io/hook: Sync
    # Retain the completed Job for inspection until the next sync replaces it.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Bound the render and apply attempts.
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-config-applier
    spec:
      restartPolicy: Never
      initContainers:
        - name: render-config
          image: mikefarah/yq:4.45.1
          command:
            - /bin/sh
            - -ec
            - |
              CLOUDFLARE_API_TOKEN_FILE=/etc/cloudflare/STALWART_CLOUDFLARE_API_TOKEN
              [ -f "$CLOUDFLARE_API_TOKEN_FILE" ] || CLOUDFLARE_API_TOKEN_FILE=/dev/null
              export CLOUDFLARE_API_TOKEN_FILE
              yq eval-all \
                --output-format=json \
                --indent=0 \
                'load("/etc/stalwart-values/values.yaml") as $values
                | (
                  .. | select(tag == "!!map")
                ) |= with_entries(
                  .key |= sub("__DOMAIN_SLUG__"; $values.domainSlug)
                  | .key |= sub("__DOMAIN_FQDN__"; $values.domainFQDN)
                  | .key |= sub("__BLOB_STORE_REGION__"; $values.blobStoreRegion)
                  | .key |= sub("__BLOB_STORE_BUCKET__"; $values.blobStoreBucket)
                  | .key |= sub("__IN_MEMORY_STORE_URL__"; $values.inMemoryStoreURL)
                  | .key |= sub("__TRACER_SLUG__"; $values.tracerSlug)
                  | .key |= sub("__INTERNAL_IP_CIDR__"; $values.internalIPCIDR)
                  | .key |= sub("__OIDC_ISSUER_URL__"; $values.oidcIssuerURL)
                )
                | (
                  .. | select(tag == "!!str")
                ) |= (
                  sub("__DOMAIN_SLUG__"; $values.domainSlug)
                  | sub("__DOMAIN_FQDN__"; $values.domainFQDN)
                  | sub("__BLOB_STORE_REGION__"; $values.blobStoreRegion)
                  | sub("__BLOB_STORE_BUCKET__"; $values.blobStoreBucket)
                  | sub("__IN_MEMORY_STORE_URL__"; $values.inMemoryStoreURL)
                  | sub("__TRACER_SLUG__"; $values.tracerSlug)
                  | sub("__INTERNAL_IP_CIDR__"; $values.internalIPCIDR)
                  | sub("__OIDC_ISSUER_URL__"; $values.oidcIssuerURL)
                )
                | (
                  .. | select(. == "__TLS_CERTIFICATE__")
                ) = load_str("/etc/tls/tls.crt")
                |
                (
                  .. | select(. == "__TLS_PRIVATE_KEY__")
                ) = load_str("/etc/tls/tls.key")
                |
                (
                  .. | select(. == "__TLS_CERTIFICATE_SANS__")
                ) = $values.tlsCertificateSANs
                |
                (
                  .. | select(. == "__CLOUDFLARE_API_TOKEN__")
                ) = load_str(strenv(CLOUDFLARE_API_TOKEN_FILE))
                |
                .' \
                /etc/stalwart-config-template/stalwart-config-base.yaml \
                > /work/stalwart-config.ndjson
          volumeMounts:
            - name: stalwart-config-template
              mountPath: /etc/stalwart-config-template
              readOnly: true
            - name: stalwart-values
              mountPath: /etc/stalwart-values
              readOnly: true
            - name: rendered
              mountPath: /work
            - name: ssl-certificate
              mountPath: /etc/tls
              readOnly: true
            - name: cloudflare-api-token
              mountPath: /etc/cloudflare
              readOnly: true
        - name: validate
          image: ghcr.io/stalwartlabs/cli:1.0.13 # Default, override with Kustomization as needed
          args:
            - --insecure
            - apply
            - --dry-run
            - --file
            - /work/stalwart-config.ndjson
          env:
            - name: STALWART_URL
              value: https://stalwart-admin:443
            - name: STALWART_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-recovery-admin
                  key: STALWART_USER
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-recovery-admin
                  key: STALWART_PASSWORD
          volumeMounts:
            - name: rendered
              mountPath: /work
              readOnly: true
        - name: apply
          image: ghcr.io/stalwartlabs/cli:1.0.13 # Default, override with Kustomization as needed
          args:
            - --insecure
            - apply
            - --file
            - /work/stalwart-config.ndjson
          env:
            - name: STALWART_URL
              value: https://stalwart-admin:443
            - name: STALWART_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-recovery-admin
                  key: STALWART_USER
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-recovery-admin
                  key: STALWART_PASSWORD
          volumeMounts:
            - name: rendered
              mountPath: /work
              readOnly: true
        - name: reload-tls-certificates
          image: ghcr.io/stalwartlabs/cli:1.0.13 # Default, override with Kustomization as needed
          args:
            - --insecure
            - create
            - action/ReloadTlsCertificates
          env:
            - name: STALWART_URL
              value: https://stalwart-admin:443
            - name: STALWART_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-recovery-admin
                  key: STALWART_USER
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-recovery-admin
                  key: STALWART_PASSWORD
      containers:
        - name: reload-settings
          image: ghcr.io/stalwartlabs/cli:1.0.13 # Default, override with Kustomization as needed
          args:
            - --insecure
            - create
            - action/ReloadSettings
          env:
            - name: STALWART_URL
              value: https://stalwart-admin:443
            - name: STALWART_USER
              valueFrom:
                secretKeyRef:
                  name: stalwart-recovery-admin
                  key: STALWART_USER
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-recovery-admin
                  key: STALWART_PASSWORD
      volumes:
        - name: stalwart-config-template
          configMap:
            name: stalwart-config-base-tpl
        - name: stalwart-values
          configMap:
            name: stalwart-config-values
        - name: ssl-certificate
          secret:
            secretName: ssl-certificate
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: cloudflare-api-token
          secret:
            secretName: stalwart-cloudflare-api-token
            optional: true
            items:
              - key: STALWART_CLOUDFLARE_API_TOKEN
                path: STALWART_CLOUDFLARE_API_TOKEN
        - name: rendered
          emptyDir: {}
