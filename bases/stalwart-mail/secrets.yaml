---
# Credentials for gaining fallback admin access in Stalwart
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-recovery-admin
  namespace: thundermail
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: stalwart-recovery-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        STALWART_RECOVERY_ADMIN: '{{ .STALWART_RECOVERY_ADMIN }}'
        STALWART_USER: '{{ first (splitList ":" .STALWART_RECOVERY_ADMIN) }}'
        STALWART_PASSWORD: '{{ rest (splitList ":" .STALWART_RECOVERY_ADMIN) | join ":" }}'
  data:
    - secretKey: STALWART_RECOVERY_ADMIN
      remoteRef:
        conversionStrategy: Default	
        decodingStrategy: None
        metadataPolicy: None
        key: "" # Populate with Kustomize
        property: recovery_admin

---
# Admin access to the Stalwart database
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-postgresql-admin-password
  namespace: thundermail
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: stalwart-postgresql-admin-password
    creationPolicy: Owner
  data:
    - secretKey: STALWART_POSTGRESQL_ADMIN_PASSWORD
      remoteRef:
        conversionStrategy: Default	
        decodingStrategy: None
        metadataPolicy: None
        key: "" # Populate with Kustomize
        property: password

---
# Basic-auth credential for Stalwart's Prometheus endpoint (/metrics/prometheus). Two consumers:
#   - the stalwart container reads `password` through STALWART_METRICS_PASSWORD (the Metrics
#     object in bases/stalwart-configs uses '@type: EnvironmentVariable');
#   - the VMServiceScrape in vmservicescrape.yaml sends `username`/`password` when scraping.
# The Metrics object pins the username to "prometheus", so the Secrets Manager entry must carry
# username=prometheus. Both consumers tolerate a missing Secret (optional env var, failing scrape),
# so an absent Secrets Manager entry degrades this ExternalSecret but never blocks the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-metrics-scrape
  namespace: thundermail
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: stalwart-metrics-scrape
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "" # Populate with Kustomize
        property: username
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "" # Populate with Kustomize
        property: password
