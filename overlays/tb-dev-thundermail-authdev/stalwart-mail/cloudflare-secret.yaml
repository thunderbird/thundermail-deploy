apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-cloudflare-api-token
  namespace: thundermail
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: stalwart-cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: STALWART_CLOUDFLARE_API_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "mzla/tb-dev/thundermail-authdev/cloudflareApiToken"
