# This file contains no overlays for the stalwart-mail and stalwart-https services, which are
# cluster-internal and do not require additional environment configuration.

---
$patch: delete
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail-private
  namespace: thundermail

---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-admin
  annotations:
    # Subnets: mzla-tb-dev-stalwart-eu-central-1a, mzla-tb-dev-stalwart-eu-central-1b
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0ae96180c6944e64e, subnet-0a6b51fec89209aea"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "environment=prod,project=mzla-tb-dev"
    # SETUP: Set this to the ID of the stalwart-admin-lb security group
    service.beta.kubernetes.io/aws-load-balancer-security-groups: ""
