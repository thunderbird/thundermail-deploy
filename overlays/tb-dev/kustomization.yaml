---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../bases

namespace: thundermail

images:
  - name: stalwartlabs/stalwart
    newTag: v0.16.16

patches:
  - path: nginx/aws/security-groups.yaml
  - path: nginx/configmap.yaml
  - path: nginx/deployment.yaml
  - path: nginx/hpas.yaml
  - path: stalwart-mail/aws/elasticache.yaml
  - path: stalwart-mail/aws/s3.yaml
  - path: stalwart-mail/aws/security-groups.yaml
  - path: stalwart-mail/aws/subnet-groups.yaml
  - path: stalwart-mail/configmap.yaml
  - path: stalwart-mail/hpas.yaml
  - path: stalwart-mail/secrets.yaml
  - path: stalwart-mail/service.yaml
  - path: stalwart-mail/serviceaccount.yaml

  - target:
      kind: Deployment
      name: stalwart
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STALWART_PUBLIC_URL
          # tb-dev Stalwart is an INTERNAL-ONLY deployment, so it advertises its
          # in-cluster endpoint. Every service it exposes is private: stalwart-https and
          # stalwart-mgmt are ClusterIP, and stalwart-admin / stalwart-mail-private are
          # INTERNAL NLBs (10.120.x.x). Its only consumer, Accounts, runs in this cluster
          # and already reaches it at this address via STALWART_BASE_API_URL.
          #
          # This value is not cosmetic: Stalwart returns it as the JMAP session `apiUrl`,
          # and well-behaved JMAP clients use that for every subsequent call INSTEAD of
          # whatever URL they were configured with. So whatever is set here is where
          # clients actually send requests -- and their credentials.
          #
          # The cert served on this in-cluster address is *.stage-thundermail.com, not the
          # Service DNS name, so consumers must skip cert-name verification on this hop.
          # Accounts already does (VERIFY_PRIVATE_LINK_SSL=false); traffic stays TLS and
          # never leaves the cluster.
          value: "https://stalwart-https.thundermail.svc.cluster.local"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STALWART_RECOVERY_MODE_LOG_LEVEL
          value: "debug"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STALWART_RECOVERY_MODE
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MIGRATION_TEST_STALWART_POSTGRESQL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: migration-test-stalwart-postgresql-admin-password
              key: STALWART_POSTGRESQL_ADMIN_PASSWORD
