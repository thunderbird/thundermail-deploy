    services.k8s.aws/adoption-policy: "adopt-or-create"
spec:
  vpcID: "" # SETUP: Set the VPC ID of the deployment environment
  tags:
    - key: Name
      value: "" # SETUP: Set a unique name for this security group
    - key: application
      value: thundermail
    - key: managed-by
      value: ack
  ingressRules:
    - fromPort: 443
      toPort: 443
      ipProtocol: tcp
      userIDGroupPairs:
