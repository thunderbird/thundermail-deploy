---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: thundermail
spec:
  template:
    spec:
      containers:
        - name: nginx
          image: nginx:1.31
          imagePullPolicy: IfNotPresent
          resources:
            # SETUP: Adjust your container sizing parameters appropriate to your deployment.
            requests:
              cpu: "0.5"
              memory: 0.5Gi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - name: smtp
              containerPort: 25
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imaps
              containerPort: 993
            - name: sieve
              containerPort: 4190
            - name: https
              containerPort: 443
            - name: nginx-health
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: nginx-health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: nginx-health
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config-dir
              mountPath: /etc/nginx
              readOnly: true
      volumes:
        - name: nginx-config-dir
          projected:
            sources:
              - configMap:
                  name: nginx-config
                  items:
                    - key: nginx.conf
                      path: nginx.conf
              # SETUP: If you support more than one mail domain, you will need to update the `secret` settings below
              #        to make sure your TLS secrets get correctly mounted into the container. Coordinate these settings
              #        with your ConfigMap settings to get the right certs attached to the right domain configs.
              - secret:
                  name: ssl-certificate
                  items:
                    - key: tls.crt
                      path: ssl-certificate.crt
                    - key: tls.key
                      path: ssl-certificate.key
