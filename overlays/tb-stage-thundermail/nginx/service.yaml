---
apiVersion: v1
kind: Service
metadata:
  name: nginx

  annotations:
    # EKS-specific annotations are documented in "Use Service Annotations to configure Network Load Balancers":
    # https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-nlb.html
    # A full list of annotations supported by the AWS Load Balancer controller can be found here:
    # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/service/annotations/

    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
    service.beta.kubernetes.io/aws-load-balancer-name: "stalwart-nginx-thundermail"
    # mzla-tb-stage-public-eu-central-1a, mzla-tb-stage-public-eu-central-1b
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0124358e1543bbab8, subnet-05eb3744fb2621593"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "environment=tb-stage,project=thundermail"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-0485ef03e0bfe74c9" # stalwart-nginx-lb-thundermail
    # Client IP preservation on every target group, no PROXY protocol. Health checks use pod port 8081, which is not a Service port.
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "preserve_client_ip.enabled=true,proxy_protocol_v2.enabled=false"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8081"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/"
spec:
  ports:
    - port: 587
      targetPort: submission
