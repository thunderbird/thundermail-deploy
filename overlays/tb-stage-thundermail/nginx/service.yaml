---
apiVersion: v1
kind: Service
metadata:
  name: nginx

  annotations:
    # EKS-specific annotations are documented in "Use Service Annotations to configure Network Load Balancers":
    # https://docs.aws.amazon.com/eks/latest/userguide/auto-configure-nlb.html
    # A full list of annotations supported by the AWS Load Balancer controller can be found here:
    # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/service/annotations/

    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
    service.beta.kubernetes.io/aws-load-balancer-name: "stalwart-nginx-thundermail"
    # mzla-tb-stage-private-eu-central-1a, mzla-tb-stage-private-eu-central-1b
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-048b99aaf2118f800, subnet-0152e8003b9be103b"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "environment=tb-stage,project=thundermail"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-019a7f8fbf19671c2" # stalwart-nginx-thundermail
    # PROXY protocol on every target group. Health checks use pod port 80, which is not a Service port.
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "80"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/"
