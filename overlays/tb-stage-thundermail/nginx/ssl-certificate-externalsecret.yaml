---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssl-certificate
  namespace: thundermail
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ssl-certificate
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: Base64
        metadataPolicy: None
        key: mzla/tb-stage/thundermail/ssl-certificate
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: Base64
        metadataPolicy: None
        key: mzla/tb-stage/thundermail/ssl-certificate
        property: tls.key
