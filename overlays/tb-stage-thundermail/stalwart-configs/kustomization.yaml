apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../bases/stalwart-configs
  - security-group-policy.yaml
  - route53-credentials.yaml

namespace: thundermail

generatorOptions:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous

configMapGenerator:
  - name: stalwart-config-values
    files:
      - values.yaml=config/values.yaml
  - name: stalwart-config-base-tpl
    behavior: merge
    files:
      - stalwart-config-dns-route53.yaml=config/dns-route53-tpl.yaml

patches:
  - target:
      kind: ConfigMap
      name: stalwart-config-(values|base-tpl)
    patch: |-
      - op: add
        path: /immutable
        value: true

  - path: job.yaml

# To use a deployment-specific Stalwart CLI version, uncomment and set one of
# these image overrides. The image name must match the image in job.yaml.
#
# images:
#   - name: ghcr.io/stalwartlabs/cli
#     newTag: 1.0.13
#
# For stronger reproducibility, pin an immutable digest instead:
#
# images:
#   - name: ghcr.io/stalwartlabs/cli
#     digest: sha256:<immutable-digest>
