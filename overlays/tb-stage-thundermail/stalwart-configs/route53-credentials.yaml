---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-route53-credentials
  namespace: thundermail
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: stalwart-route53-credentials
    creationPolicy: Owner
  data:
    - secretKey: ROUTE53_ACCESS_KEY_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "mzla/tb-stage/thundermail/stalwart-route53-credential"
        property: access_key_id
    - secretKey: ROUTE53_SECRET_ACCESS_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "mzla/tb-stage/thundermail/stalwart-route53-credential"
        property: secret_access_key
