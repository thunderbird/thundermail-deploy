# Non-secret values for the tb-stage-thundermail Stalwart configuration.
# Keep credentials, API tokens, certificates, and private keys in Kubernetes
# Secrets; the applier injects those at render time.
domainSlug: stage-thundermail
domainFQDN: stage-thundermail.com
blobStoreRegion: EuCentral1
blobStoreBucket: mzla-tb-stage-thundermail-stalwart-blob-store
inMemoryStoreURL: rediss://master.stalwart-redis-thundermail.dxtglz.euc1.cache.amazonaws.com
tracerSlug: stdout
internalIPCIDR: 10.140.0.0/16
tlsCertificateSANs:
  '*.stage-thundermail.com': true
oidcIssuerURL: https://auth.stage-thundermail.com/realms/tbpro
stalwartPgHost: ep-empty-pond-b9gr26c1-pooler.c-7.eu-central-1.aws.neon.tech
stalwartPgDatabase: neondb
stalwartPgAdminUsername: neondb_owner
dnsManagement: Automatic
dnsPublishSpf: false
authBanRateCount: 5000
scanBanRateCount: 30
addressBookName: Thundermail Address Book
allowedIPs:
  ipallow-legacy-1:
    address: 10.11.0.0/16
    reason: Migrated from v0.15
  ipallow-legacy-2:
    address: 18.96.47.152/29
    reason: Migrated from v0.15
webhookURL: https://accounts.stage-thundermail.com/api/v1/telemetry/stalwart/webhook/
webhookEvents:
  message-ingest.ham: true
  message-ingest.spam: true
  queue.authenticated-message-queued: true
