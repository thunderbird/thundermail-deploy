---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../bases

namespace: "thundermail"

images:
  - name: stalwartlabs/stalwart
    newTag: v0.16.25
    digest: sha256:74e5a7d55303ba525d939c6bf97ed4e010df7521f52d80afc22a815b66bd53f3

patches:
  - path: nginx/configmap.yaml
  - path: nginx/deployment.yaml
  - path: nginx/hpas.yaml
  - path: nginx/security-group-policy.yaml
  - path: stalwart-mail/configmap.yaml
  - path: stalwart-mail/hpas.yaml
  - path: stalwart-mail/secrets.yaml
  - path: stalwart-mail/security-group-policy.yaml
  - path: stalwart-mail/service.yaml
  - path: stalwart-mail/serviceaccount.yaml

  - path: nginx/service.yaml

  - target:
      kind: Deployment
      name: stalwart
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STALWART_PUBLIC_URL
          value: "https://mail.stage-thundermail.com"
