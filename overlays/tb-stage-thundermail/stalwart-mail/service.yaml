# This file contains no overlays for the stalwart-mail and stalwart-https services, which are
# cluster-internal and do not require additional environment configuration.

---
$patch: delete
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail-private
  namespace: thundermail

---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-admin
  annotations:
    # mzla-tb-stage-stalwart-eu-central-1a, mzla-tb-stage-stalwart-eu-central-1b
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0587587ca00284481,subnet-060bcaf1c1f5569cc"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "environment=tb-stage,project=thundermail"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-00f80b61d28a729f8" # stalwart-admin-lb-thundermail
    service.beta.kubernetes.io/aws-load-balancer-name: "stalwart-admin-thundermail"
