---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
    service.beta.kubernetes.io/aws-load-balancer-name: "stalwart-nginx"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0807adf98a8c7f4fd, subnet-07d002df085141478"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "environment=prod,project=mzla-tb-prod"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-077d85fbd1552674e"
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "preserve_client_ip.enabled=true,proxy_protocol_v2.enabled=false"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8081"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/"
spec:
  loadBalancerClass: service.k8s.aws/nlb
  ports:
    - port: 587
      targetPort: submission
