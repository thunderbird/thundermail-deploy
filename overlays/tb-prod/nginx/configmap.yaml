---
# ConfigMap containing the nginx configuration file
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: thundermail
data:
  nginx.conf: |
    # Nginx does support special mail proxy services --
    #     https://docs.nginx.com/nginx/admin-guide/mail-proxy/mail-proxy/
    # -- but they are built around the needs of legacy mail systems. Stalwart handles these things
    # for us internally now, and we should allow it to do so. Therefore, we use a standard TCP
    # reverse proxy configuration for our purposes.
    #    https://docs.nginx.com/nginx/admin-guide/load-balancer/tcp-udp-load-balancer/

    load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
    load_module /usr/lib/nginx/modules/ngx_stream_js_module.so;

    user nginx;
    worker_processes auto;

    error_log /var/log/nginx/error.log warn;
    pid /run/nginx.pid;

    stream {
      js_import jmap from /etc/nginx/jmap.js;

      log_format json '{"timestamp": "$time_iso8601", "connection": "$connection", "remote_addr": "$remote_addr", '
          '"hostname": "$hostname", "proxy_protocol": {"addr": "$proxy_protocol_addr", "port": "$proxy_protocol_port", '
          '"server_addr": "$proxy_protocol_server_addr", "server_port": "$proxy_protocol_server_port"}, '
          '"server_addr": "$server_addr", "server_port": "$server_port", "session_time": "$session_time", '
          '"protocol": "$protocol", "status": "$status", "bytes_sent": "$bytes_sent", "bytes_received": "$bytes_received", '
          '"upstream_bytes_sent": "$upstream_bytes_sent", "upstream_byte_received": "$upstream_bytes_received", '
          '"upstream_connect_time": "$upstream_connect_time"}';

      upstream stalwart-smtp {
        server stalwart-mail:25;
      }

      upstream stalwart-smtps {
        server stalwart-mail:465;
      }

      upstream stalwart-starttls {
        server stalwart-mail:587;
      }

      upstream stalwart-imaps {
        server stalwart-mail:993;
      }

      upstream stalwart-managesieve {
        server stalwart-mail:4190;
      }

      upstream stalwart-https {
        server stalwart-https:443;
      }

      server {
        listen 25;
        proxy_connect_timeout 1s;
        proxy_timeout 3s;
        proxy_pass stalwart-smtp;
        access_log /var/log/nginx/access.log json;
      }

      server {
        listen 465;
        proxy_connect_timeout 1s;
        proxy_timeout 3s;
        proxy_pass stalwart-smtps;
        access_log /var/log/nginx/access.log json;

      }

      server {
        listen 587;
        proxy_connect_timeout 1s;
        proxy_timeout 3s;
        proxy_pass stalwart-starttls;
        access_log /var/log/nginx/access.log json;
      }

      server {
        listen 993;
        proxy_connect_timeout 1s;
        proxy_timeout 3s;
        proxy_pass stalwart-imaps;
        access_log /var/log/nginx/access.log json;
      }

      server {
        listen 4190;
        proxy_connect_timeout 1s;
        proxy_timeout 3s;
        proxy_pass stalwart-managesieve;
        access_log /var/log/nginx/access.log json;
      }

      server {
        listen 127.0.0.1:8090;
        proxy_connect_timeout 1s;
        proxy_timeout 10m;
        proxy_pass stalwart-https;
        proxy_ssl on;
        proxy_ssl_name mail.thundermail.com;
        js_filter jmap.wsFilter;
      }
    }

    # HTTP traffic to Stalwart is always encrypted. We need to decrypt it here so we can determine
    # if the traffic, based on the HTTP path, is permissible. While most of Stalwart's API functions
    # are acceptable or required for users to access, we wish to deny access to any administrative
    # functions, even user account self-service functions (since these are handled instead by our
    # own thunderbird-accounts project). All other HTTP-based traffic is sent on to the real
    # Stalwart host upstream.
    #
    # Documentation for HTTP server configuration can be found here:
    # https://nginx.org/en/docs/http/configuring_https_servers.html

    events {}

    http {
      js_import jmap from /etc/nginx/jmap.js;

      map $request_uri $stalwart_route {
        "~^/jmap/ws(?:[/?#]|$)"                ws;
        "~^/jmap(?:/(?:/[^?#]*)?)?(?:[?#]|$)"  api;
        default                                "";
      }

      upstream stalwart-https {
        # The "stalwart-https" server is a Kubernetes Service exposing Stalwart's HTTPS port to
        # internal sources.
        server stalwart-https:443;
      }

      server {
        server_name *.thundermail.com;
        listen 443 ssl;
        keepalive_timeout 60s;
        proxy_connect_timeout 1s;

        # --- SSL Configuration ---
        # These files are populated as volumes mounted to the pods from secrets drawn from an
        # external secret store.
        ssl_certificate /etc/nginx/ssl-certificate.crt;
        ssl_certificate_key /etc/nginx/ssl-certificate.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Enable gzip compression
        gzip on;
        gzip_types application/json;

        client_max_body_size 50m;

        # Specifically block access to these routes
        location ^~ /account {  # Stalwart's user account settings system, superceded by thunderbird-accounts
          return 404;
        }

        location ^~ /admin {  # Stalwart's web admin console, only accessible by private route
          return 404;
        }

        location ^~ /api {  # Stalwart's underlying API system, only accessible by private route
          return 404;
        }

        location ^~ /metrics {  # Stalwart's Prometheus exporter, scraped in-cluster on the mgmt port only
          return 404;
        }

        # All other routes are acceptable, and should be proxied to the backend
        location ^~ / {
          if ($stalwart_route = api) {
            rewrite ^ /.jmap-api last;
          }
          if ($stalwart_route = ws) {
            rewrite ^ /.jmap-ws last;
          }
          proxy_pass https://stalwart-https;
          proxy_set_header Host mail.thundermail.com;
          proxy_ssl_name mail.thundermail.com;
        }

        location = /.jmap-api {
          internal;
          client_max_body_size 1m;
          client_body_buffer_size 1m;
          js_content jmap.filter;
        }

        location = /.jmap-ws {
          internal;
          proxy_pass http://127.0.0.1:8090$request_uri;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection upgrade;
          proxy_set_header Host mail.thundermail.com;
          proxy_read_timeout 10m;
        }

        location @stalwart {
          proxy_pass https://stalwart-https$request_uri;
          proxy_set_header Host mail.thundermail.com;
          proxy_ssl_name mail.thundermail.com;
        }
      }

      # Small HTTP server to serve health checks for the nginx service itself.
      server {
        listen 80;
        # Return 200s for calls to exactly `/` (no subpaths)
        location = / {
          return 200;
        }
        # Return 404s for anything else
        location / {
          return 404;
        }
      }
    }
  jmap.js: |
    const POLICY_CLOSE = Buffer.from([0x88, 0x82, 0, 0, 0, 0, 0x03, 0xf0]);
    const MAX_MESSAGE = 1048576;
    const MAX_FRAGMENTS = 1024;

    function filter(r) {
      if (r.method === 'POST' && !isUserMessage(r.requestText)) {
        r.return(403);
        return;
      }

      r.internalRedirect('@stalwart');
    }

    function isUserMessage(text) {
      try {
        const calls = JSON.parse(text).methodCalls;
        return calls === undefined || (Array.isArray(calls) && calls.every((call) =>
          Array.isArray(call) && typeof call[0] === 'string' && !call[0].startsWith('x:')));
      } catch (e) {
        return false;
      }
    }

    function wsFilter(s) {
      let pending = Buffer.alloc(0);
      let upgraded = false;
      let blocked = false;
      let frames = [];
      let payload = [];
      let size = 0;

      function block() {
        blocked = true;
        s.send(POLICY_CLOSE);
      }

      s.on('upstream', (data) => {
        if (blocked) {
          return;
        }

        pending = Buffer.concat([pending, data]);

        if (!upgraded) {
          const end = pending.indexOf('\r\n\r\n');
          if (end < 0) {
            return;
          }
          s.send(pending.subarray(0, end + 4));
          pending = pending.subarray(end + 4);
          upgraded = true;
        }

        while (pending.length >= 2) {
          const first = pending[0];
          const opcode = first & 0x0f;
          const control = opcode >= 8;
          let length = pending[1] & 0x7f;
          let offset = 2;

          if (length === 126) {
            if (pending.length < 4) {
              return;
            }
            length = pending.readUInt16BE(2);
            offset = 4;
          } else if (length === 127) {
            if (pending.length < 10) {
              return;
            }
            length = pending.readUInt32BE(2) * 0x100000000 + pending.readUInt32BE(6);
            offset = 10;
          }

          const valid = (first & 0x70) === 0 && (pending[1] & 0x80) !== 0 && (control
            ? opcode <= 10 && length <= 125 && (first & 0x80) !== 0
            : opcode <= 2 && (opcode === 0) === (frames.length > 0) && size + length <= MAX_MESSAGE
              && frames.length < MAX_FRAGMENTS);
          if (!valid) {
            block();
            return;
          }

          offset += 4;
          if (pending.length < offset + length) {
            return;
          }

          const frame = pending.subarray(0, offset + length);
          pending = pending.subarray(offset + length);

          if (control) {
            s.send(frame);
            continue;
          }

          const unmasked = Buffer.alloc(length);
          for (let i = 0; i < length; i++) {
            unmasked[i] = frame[offset + i] ^ frame[offset - 4 + (i % 4)];
          }
          frames.push(frame);
          payload.push(unmasked);
          size += length;

          if (first & 0x80) {
            if (!isUserMessage(Buffer.concat(payload).toString())) {
              block();
              return;
            }
            frames.forEach((f) => s.send(f));
            frames = [];
            payload = [];
            size = 0;
          }
        }
      });
    }

    export default { filter, wsFilter };
