---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - nginx/ssl-certificate-externalsecret.yaml
  - ../../bases
  - stalwart-configs/security-group-policy.yaml

components:
  - ../../components/nginx-jmap-filter

namespace: "thundermail"

images:
  - name: stalwartlabs/stalwart
    newTag: v0.16.27
    digest: sha256:c429b311c93db5606598abc1c68225a85a6953183848ae01bee9c6a98885836c

patches:
  - path: nginx/configmap.yaml
  - path: nginx/deployment.yaml
  - path: nginx/hpas.yaml
  - path: nginx/security-group-policy.yaml
  - path: nginx/service.yaml
  - path: stalwart-mail/configmap.yaml
  - path: stalwart-mail/hpas.yaml
  - path: stalwart-mail/secrets.yaml
  - path: stalwart-mail/security-group-policy.yaml
  - path: stalwart-mail/service.yaml
  - path: stalwart-mail/serviceaccount.yaml

  - target:
      kind: SecurityGroup
      name: stalwart-nginx-lb
    patch: |
      - op: delete

  - target:
      kind: Deployment
      name: stalwart
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STALWART_PUBLIC_URL
          value: "https://mail.thundermail.com"
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 180
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 1900
