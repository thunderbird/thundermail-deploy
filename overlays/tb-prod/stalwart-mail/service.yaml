# This file contains no overlays for the stalwart-mail and stalwart-https services, which are
# cluster-internal and do not require additional environment configuration.

---
$patch: delete
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail-private
  namespace: thundermail

---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-admin
  annotations:
    # Subnets: mzla-tb-prod-stalwart-eu-central-1a, mzla-tb-prod-stalwart-eu-central-1b
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0a98c29bd563864be, subnet-0707b308b8b35a48c"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "environment=prod,project=mzla-tb-prod"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-0b9631e7a165dc3a7" # stalwart-admin-lb-thundermail
