---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: stalwart-server
  namespace: thundermail
  annotations:
    services.k8s.aws/adoption-policy: "adopt-or-create"
    services.k8s.aws/adoption-fields: |
      {"id": "sg-07f59e7e9ea8b2f0f"}
spec:
  vpcID: vpc-0c7a0ef4fdd2b8275
  ingressRules:
    # Port 8080 is the managmement service port, which we do not wish to expose except through the
    # Tailscale meshnet. These allowances permit health checks from the Kubernetes cluster and
    # debug traffic from other stalwart pods (for using stalwart-cli, for example).
    - fromPort: 8080
      toPort: 8080
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Kubelet probes from EKS cluster SG
          groupID: sg-08711bcc50c7b1e18 # eks-cluster-sg-mzla-eks-tb-prod01
        - description: Allow management port traffic only from other stalwart-server sources
          groupID: sg-07f59e7e9ea8b2f0f # stalwart-server
    # The rest of these are service ports which we will expose only to the nginx containers and
    # other private access routes.
    - fromPort: 25
      toPort: 25
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow SMTP service traffic from the nginx containers
          groupID: "sg-0c42a6600ec8831d2" # stalwart-nginx
        # - description: Allow SMTP service traffic from the private mail load balancer
        #   groupID: "" # stalwart-mail-private-lb
    - fromPort: 443
      toPort: 443
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow HTTPS service traffic from the nginx containers
          groupID: sg-0c42a6600ec8831d2  # stalwart-nginx
        - description: Allow HTTPS service traffic from the private stalwart load balancer
          groupID: sg-07a13b4ef1abfc7c0  # stalwart-admin-lb
    - fromPort: 465
      toPort: 465
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow SMTPS service traffic from the nginx containers
          groupID: sg-0c42a6600ec8831d2  # stalwart-nginx
    - fromPort: 587
      toPort: 587
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow STARTTLS service traffic from the nginx containers
          groupID: sg-0c42a6600ec8831d2  # stalwart-nginx
    - fromPort: 993
      toPort: 993
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow IMAPS service traffic from the nginx containers
          groupID: sg-0c42a6600ec8831d2  # stalwart-nginx
    - fromPort: 4190
      toPort: 4190
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow ManageSieve service traffic from the nginx containers
          groupID: sg-0c42a6600ec8831d2  # stalwart-nginx

# Security group for private mail service access
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: stalwart-mail-private-lb
  namespace: thundermail
spec:
  vpcID: vpc-0c7a0ef4fdd2b8275
  ingressRules:
    - fromPort: 25
      toPort: 25
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow access from Stalwart node 10 (mail) in prod
          groupID: sg-052805d070cd91ec9
        - description: Allow access from Stalwart node 11 (mail) in prod
          groupID: sg-04ef7e0e4fce5a3ff
        - description: Allow access from Stalwart node 12 (mail) in prod
          groupID: sg-0c05aa0b38272e3cc
        - description: Allow access from Stalwart node 13 (mail) in prod
          groupID: sg-0160e600c6289bb82
        - description: Allow access from Stalwart node 60 (mgmt) in prod
          groupID: sg-02dab3807cc8b3c42
        - description: Allow access from Stalwart node 61 (mgmt) in prod
          groupID: sg-0a17325bba7d4d500

---
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: stalwart-server
  namespace: thundermail
spec:
  securityGroups:
    groupIds:
      - sg-01502e50caccc6795  # EKS cluster
      - sg-07f59e7e9ea8b2f0f  # Stalwart pods

# Security group for the admin/mgmt service's load balancer
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: stalwart-admin-lb
  namespace: thundermail
  annotations:
    services.k8s.aws/adoption-policy: "adopt-or-create"
    services.k8s.aws/adoption-fields: |
      {"id": "sg-07a13b4ef1abfc7c0"}
spec:
  vpcID: vpc-0c7a0ef4fdd2b8275
  ingressRules:
    - fromPort: 443
      toPort: 443
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow access from Accounts API in prod
          groupID: sg-034b36952ac31b87b
        - description: Allow access from Accounts Celery in prod
          groupID: sg-0ede6c1f9f8a4b676

# SG for the Redis host
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: stalwart-elasticache-redis
  namespace: thundermail
  annotations:
    services.k8s.aws/adoption-policy: "adopt-or-create"
    services.k8s.aws/adoption-fields: |
      {"id": "sg-0f0b4f8140771a1cf"}
spec:
  vpcID: vpc-0c7a0ef4fdd2b8275
  ingressRules:
    - fromPort: 6379
      toPort: 6379
      ipProtocol: tcp
      userIDGroupPairs:
        - description: Allow traffic from Stalwarts server containers
          groupID: sg-07f59e7e9ea8b2f0f  # Stalwart pods
