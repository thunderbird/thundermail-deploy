apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../bases/stalwart-configs
  - stalwart-webhook-secret.yaml

namespace: thundermail

generatorOptions:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous

configMapGenerator:
  - name: stalwart-config-values
    files:
      - values.yaml=config/values.yaml

patches:
  - target:
      kind: ConfigMap
      name: stalwart-config-values
    patch: |-
      - op: add
        path: /immutable
        value: true
