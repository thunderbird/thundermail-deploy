name: validate

concurrency:
  group: validate
  cancel-in-progress: true

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!**stalwart-configs-preview**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  kustomize-build:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    steps:
      - uses: actions/checkout@v4

      - name: Build all Kustomize overlays
        run: ./util/kustomize-build-all.sh

      - name: Build Stalwart configuration overlays
        run: |
          for overlay in overlays/*/stalwart-configs; do
            kustomize build "$overlay" > /dev/null
          done
          ! grep -rEn '\$\{[A-Z0-9_]+\}' overlays/*/stalwart-configs
