apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: stalwart-webhook-secret
  namespace: thundermail
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: mzla/tb-stage/accounts
      metadataPolicy: None
      property: STALWART_WEBHOOK_SECRET
    secretKey: STALWART_WEBHOOK_SECRET
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    name: stalwart-webhook-secret
